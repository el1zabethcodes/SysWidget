name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW (msys2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          mkdir -p bin
          g++ -std=c++20 -O2 -municode -mwindows -Wall -Wextra -Wno-unused-parameter \
            src/main.cpp -o bin/SysWidget.exe -Isrc -static \
            -ldwmapi -ld2d1 -ldwrite -ld3d11 -ldxgi -ldcomp \
            -luuid -lole32 -loleaut32 -luser32 -lgdi32 -lshell32 -ladvapi32 -lshlwapi -lcomctl32 -luxtheme
          ls -la bin/SysWidget.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysWidget.exe
          path: bin/SysWidget.exe

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/SysWidget.exe
